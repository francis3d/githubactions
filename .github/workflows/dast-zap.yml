name: Security OWASP ZAP

on:
  workflow_run:
    workflows:
      - Staging Deploy
    types:
      - completed
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: dast-zap-${{ github.ref_name }}
  cancel-in-progress: false

timeout-minutes: 120

jobs:
  baseline_scan:
    name: Security / OWASP ZAP
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Validate staging URL
        run: |
          set -euo pipefail
          if [ -z "${STAGING_URL:-}" ]; then
            echo 'STAGING_URL is not defined in the environment.'
            exit 1
          fi
          echo "STAGING_URL=$STAGING_URL" >> $GITHUB_STEP_SUMMARY

      - name: Run ZAP full scan
        uses: zaproxy/action-full-scan@bee4e5be916301228d2b1b2dcad73aab6fa6a25b
        with:
          target: ${{ env.STAGING_URL }}
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          cmd_options: '-T 10m -r zap-report.html'
          fail_action: false
          artifact_name: zap_scan

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zap-report
          path: zap-report.html

  quality_gate_final_validation:
    name: Quality Gate / Final Validation
    runs-on: ubuntu-latest
    needs: baseline_scan
    if: always()
    steps:
      - name: Consolidate ZAP result
        run: |
          if [ "${{ needs.baseline_scan.result }}" != 'success' ]; then
            echo 'Security / OWASP ZAP did not complete successfully.'
            exit 1
          fi
          echo 'Security / OWASP ZAP completed successfully.'
          echo 'ZAP baseline scan report uploaded.' >> $GITHUB_STEP_SUMMARY
