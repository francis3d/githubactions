name: Security Secret Scan

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  secret_scan:
    name: Security / Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Validate security exceptions
        run: |
          python - <<'PY'
          import pathlib, re, datetime, sys
          path = pathlib.Path('.security/exceptions.yml')
          if not path.exists():
              sys.exit(0)
          text = path.read_text()
          dates = re.findall(r'^\s*expires_on:\s*(\d{4}-\d{2}-\d{2})', text, flags=re.M)
          for value in dates:
              if datetime.date.fromisoformat(value) < datetime.date.today():
                  print(f'Expired exception: {value}')
                  sys.exit(1)
          PY

      - name: Run GitLeaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        with:
          args: '--path=./ --report-format=json --report-path=gitleaks-report.json --redact --exit-code=1'

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  quality_gate_final_validation:
    name: Quality Gate / Final Validation
    runs-on: ubuntu-latest
    needs: secret_scan
    if: always()
    steps:
      - name: Consolidate secret scan result
        run: |
          if [ "${{ needs.secret_scan.result }}" != 'success' ]; then
            echo 'Security / Secret Scan did not complete successfully.'
            exit 1
          fi
          echo 'Security / Secret Scan completed successfully.'
          echo 'Secret scanning passed.' >> $GITHUB_STEP_SUMMARY
