name: Security Dependency Review

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: dependency-review-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  dependency_review:
    name: Security / Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Validate security exceptions
        run: |
          python - <<'PY'
          import pathlib, re, datetime, sys
          path = pathlib.Path('.security/exceptions.yml')
          if not path.exists():
              sys.exit(0)
          text = path.read_text()
          dates = re.findall(r'^\s*expires_on:\s*(\d{4}-\d{2}-\d{2})', text, flags=re.M)
          for value in dates:
              if datetime.date.fromisoformat(value) < datetime.date.today():
                  print(f'Expired exception: {value}')
                  sys.exit(1)
          PY

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Cache npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run dependency review
        run: |
          set -euo pipefail
          if node -e "const p=require('./package.json'); process.stdout.write(p.scripts && p.scripts['dependency-review'] ? 'true' : '')" | grep -q true; then
            npm run dependency-review
            exit 0
          fi
          if [ -f package-lock.json ]; then
            npm audit --json > audit.json || true
            node - <<'NODE'
const fs = require('fs');
const report = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
const vulnerabilities = report.vulnerabilities || {};
const issues = Object.values(vulnerabilities).filter(v => ['high','critical'].includes(v.severity));
if (issues.length) {
  console.error('Dependency review found high/critical issues:');
  issues.forEach(i => console.error(`${i.name}: ${i.severity}`));
  process.exit(1);
}
console.log('No high/critical dependency vulnerabilities were found.');
NODE
            exit 0
          fi
          echo 'No dependency review path available from package-lock.json or dependency-review script.' >> $GITHUB_STEP_SUMMARY

      - name: Upload dependency review report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-review-report
          path: audit.json

  quality_gate_final_validation:
    name: Quality Gate / Final Validation
    runs-on: ubuntu-latest
    needs: dependency_review
    if: always()
    steps:
      - name: Consolidate dependency review result
        run: |
          if [ "${{ needs.dependency_review.result }}" != 'success' ]; then
            echo 'Security / Dependency Review did not complete successfully.'
            exit 1
          fi
          echo 'Security / Dependency Review completed successfully.'
          echo 'Dependency review passed.' >> $GITHUB_STEP_SUMMARY
