name: Artifact Build

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artifact-build-${{ github.ref_name }}
  cancel-in-progress: false

timeout-minutes: 90

jobs:
  artifact_build:
    name: Artifact / Build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Cache npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package build artifact and compute digest
        run: |
          set -euo pipefail
          if [ ! -d dist ]; then
            echo 'Build output dist/ not found. Ensure npm run build produced artifacts.'
            exit 1
          fi
          tar -czf dist.tar.gz dist
          sha256sum dist.tar.gz | awk '{print $1}' > artifact-digest.txt
          echo "Digest: $(cat artifact-digest.txt)" >> $GITHUB_STEP_SUMMARY

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-artifact
          path: |
            dist.tar.gz
            artifact-digest.txt
            dist

  quality_gate_final_validation:
    name: Quality Gate / Final Validation
    runs-on: ubuntu-latest
    needs: artifact_build
    if: always()
    steps:
      - name: Consolidate artifact build result
        run: |
          if [ "${{ needs.artifact_build.result }}" != 'success' ]; then
            echo 'Artifact / Build did not complete successfully.'
            exit 1
          fi
          echo 'Artifact / Build completed successfully.'
          echo 'Artifact digest created.' >> $GITHUB_STEP_SUMMARY
