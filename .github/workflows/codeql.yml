name: Security CodeQL

on:
  schedule:
    - cron: '0 2 * * *'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Security / CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix:
        language:
          - javascript
    steps:
      - name: Checkout source for schedule or event
        if: github.event_name == 'schedule'
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          ref: dev

      - name: Checkout source for pull request or manual
        if: github.event_name != 'schedule'
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Validate security exceptions
        run: |
          python - <<'PY'
          import pathlib, re, datetime, sys
          path = pathlib.Path('.security/exceptions.yml')
          if not path.exists():
              sys.exit(0)
          text = path.read_text()
          dates = re.findall(r'^\s*expires_on:\s*(\d{4}-\d{2}-\d{2})', text, flags=re.M)
          for value in dates:
              if datetime.date.fromisoformat(value) < datetime.date.today():
                  print(f'Expired exception: {value}')
                  sys.exit(1)
          PY

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Cache npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Initialize CodeQL
        uses: github/codeql-action/init@bfb6be4b5ecd3650f02f530571453e8c64ef0778f
        with:
          languages: javascript

      - name: Autobuild
        run: |
          npm run build || true

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@bfb6be4b5ecd3650f02f530571453e8c64ef0778f

      - name: Publish CodeQL database artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codeql-database
          path: codeql-db

  quality_gate_final_validation:
    name: Quality Gate / Final Validation
    runs-on: ubuntu-latest
    needs: analyze
    if: always()
    steps:
      - name: Consolidate CodeQL result
        run: |
          if [ "${{ needs.analyze.result }}" != 'success' ]; then
            echo 'Security / CodeQL did not complete successfully.'
            exit 1
          fi
          echo 'Security / CodeQL completed successfully.'
          echo 'Scheduled CodeQL runs at 02:00 UTC (22:00 local, UTC-4).' >> $GITHUB_STEP_SUMMARY
